[package]
name = "burn-vllm"
version = "0.1.0"
edition = "2024"

[features]
default = ["cuda", "wgpu"]
cpu = ["burn-cubecl/cpu"]
cuda = ["burn-cubecl/cuda"]
wgpu = ["burn-cubecl/wgpu", "burn-cubecl/vulkan"]

[dependencies]
burn-cubecl = { version = "0.23.0-pre.2", default-features = false, features = ["std", "autotune", "persistence"] }
burn-backend = { version = "0.23.0-pre.2", default-features = false }
burn-std = { version = "0.23.0-pre.2", default-features = false }
futures-lite = "2"
memmap2 = "0.9"
half = "2"
bytemuck = "1"
anyhow = "1"
fancy-regex = "0.14"
rayon = "1"
env_logger = "0.11.11"
winnow-args = "0.6.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync"] }

[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
debug-assertions = false

[profile.release]
debug = "line-tables-only"
